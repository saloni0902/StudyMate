## 1. The three services

```mermaid
flowchart TB
    U([Student's browser])

    subgraph FE["Frontend · port 5173"]
        P["React pages and components"]
        AX["Axios client<br/>adds the JWT to every request"]
    end

    subgraph BE["Backend · port 5050"]
        R["Express routes<br/>auth, subjects, documents,<br/>chats, summaries, quizzes,<br/>decks, progress, dashboard"]
        MW["Middleware<br/>requireAuth (JWT) · validate · upload"]
        C[Controllers and services]
    end

    subgraph AI["AI service · port 8008"]
        API["FastAPI routes<br/>/ingest /ask /summarize<br/>/quiz /flashcards /study-plan"]
        EMB["MiniLM embeddings<br/>(runs locally)"]
        VS["FAISS vector index<br/>one per subject"]
    end

    DB[(MongoDB)]
    FS[/"backend/uploads<br/>PDF files"/]
    AD[/"ai-service/data<br/>page text + indexes"/]
    G{{"Google Gemini API<br/>(internet)"}}

    U --> P --> AX
    AX -- "/api/... + Bearer JWT<br/>(Vite proxy)" --> R
    R --> MW --> C
    C --> DB
    C --> FS
    C -- "HTTP + X-Service-Key" --> API
    API --> EMB --> VS
    API --> AD
    API -- "prompt + note passages" --> G
```

- **The browser only ever talks to the backend.** In development, Vite forwards every `/api/...` request from port 5173 to the backend on 5050 (`frontend/vite.config.js`).
- **The backend owns users, data and security.** It checks the JWT and ownership on every request and is the only one that touches MongoDB.
- **The AI service does everything AI.** It reads PDFs, creates embeddings, searches FAISS and calls Gemini. It only accepts calls carrying the shared secret `AI_SERVICE_KEY`, so in practice only the backend can use it.
- **Gemini is the only part on the internet.** It receives the question and a few passages from the notes, never whole uploads or user accounts.

## 3. Login and JWT

### Sign up / log in

```mermaid
sequenceDiagram
    autonumber
    actor S as Student
    participant FE as Frontend<br/>Login.jsx · AuthContext
    participant BE as Backend<br/>routes/auth.js · authController.js
    participant DB as MongoDB<br/>users

    S->>FE: Types email + password, clicks "Log in"
    FE->>BE: POST /api/auth/login {email, password}
    BE->>BE: express-validator checks the email format and that the password isn't empty
    BE->>DB: User.findOne({email}) incl. passwordHash
    DB-->>BE: user (or none)
    BE->>BE: bcrypt.compare(password, passwordHash)
    alt wrong email or password
        BE-->>FE: 401 "Incorrect email or password"
        FE-->>S: Error shown on the form
    else correct
        BE->>BE: jwt.sign({sub: userId}, JWT_SECRET, {expiresIn: "7d"})
        BE-->>FE: 200 {token, user}
        FE->>FE: tokenStore.set(token) → localStorage
        FE-->>S: Goes to the dashboard
    end
```

- **Sign-up** (`POST /api/auth/register`) is the same, except the backend first checks the email isn't taken, then stores `bcrypt.hash(password, 10)`. The real password is never saved.
- **The JWT** contains only the user's id (`sub`) and an expiry date. It is signed with `JWT_SECRET` from `backend/.env`, so it can't be forged or edited without the secret (`backend/src/middleware/auth.js`).

### Opening the app with a saved login

```mermaid
sequenceDiagram
    autonumber
    participant FE as Frontend<br/>AuthContext · ProtectedRoute
    participant BE as Backend
    participant DB as MongoDB

    FE->>FE: Token in localStorage?
    alt no token
        FE->>FE: Show /login
    else token found
        FE->>BE: GET /api/auth/me (Bearer token)
        BE->>BE: requireAuth: jwt.verify + account still exists?
        BE->>DB: User.findById
        alt valid
            BE-->>FE: 200 {user}
            FE->>FE: Show the app
        else 401 (expired, bad, or account gone)
            BE-->>FE: 401
            FE->>FE: Delete token, show /login with a notice
        else backend unreachable
            FE->>FE: Keep the token, show "Can't reach StudyMate" + Try again
        end
    end
```

## 4. Every request after login

Every page uses the same path: the Axios client adds the token, and `requireAuth` decides who the user is before any controller runs.

```mermaid
sequenceDiagram
    autonumber
    participant FE as Frontend<br/>api/client.js (Axios)
    participant MW as requireAuth<br/>middleware/auth.js
    participant V as validate<br/>express-validator
    participant C as Controller
    participant DB as MongoDB

    FE->>MW: Any /api request + "Authorization: Bearer #lt;JWT#gt;"
    MW->>MW: jwt.verify(token, JWT_SECRET)
    MW->>DB: User.exists({_id: sub})
    alt token missing, invalid, expired, or user gone
        MW-->>FE: 401
        FE->>FE: Axios interceptor logs out → /login
    else ok
        MW->>V: req.userId = sub
        V->>V: Check body / params
        alt invalid input
            V-->>FE: 400 {error: {code: "VALIDATION_ERROR", message}}
        else ok
            V->>C: next()
            C->>DB: Query ALWAYS filtered by {userId: req.userId}
            C-->>FE: JSON response
        end
    end
```

Every query is filtered by the logged-in user's id. Another student's subject, quiz or chat simply isn't found, and the API answers 404.

## 5. Uploading a PDF

```mermaid
sequenceDiagram
    autonumber
    actor S as Student
    participant FE as Frontend<br/>Documents.jsx
    participant BE as Backend<br/>upload.js · documentController · documentService
    participant DB as MongoDB
    participant AI as AI service<br/>main.py /ingest
    participant G as Gemini

    S->>FE: Drops OS.pdf
    FE->>BE: POST /api/subjects/:id/documents (multipart, JWT)
    BE->>DB: Subject belongs to this user? (loadSubject)
    BE->>BE: Multer saves to uploads/#lt;random#gt;.pdf (max 20 MB)
    BE->>BE: First bytes are "%PDF-"? (rejects renamed files)
    BE->>DB: Document {status: "processing"}
    BE-->>FE: 201 document (processing)
    Note over FE: Page re-checks every 2 s while anything is processing
    BE->>AI: POST /ingest {subjectId, documentId, filePath} + X-Service-Key
    AI->>AI: File inside backend/uploads? (refuses any other path)
    AI->>AI: PyMuPDF: text page by page (fails clearly for scans or passwords)
    AI->>AI: Chunker: ~800 chars, 150 overlap, never across pages
    AI->>AI: MiniLM: one 384-number vector per chunk
    AI->>AI: FAISS: add vectors to the subject's index, save to disk
    AI->>AI: Save page text to data/documents/
    AI->>G: "List 3-12 main topics" (one request, skipped if Gemini fails)
    G-->>AI: ["Process states", "Round Robin", ...]
    AI-->>BE: {pages, emptyPages, charCount, chunkCount, topics}
    BE->>DB: Document {status: "ready", pages, topics, ...}
    FE->>BE: GET /api/subjects/:id/documents (poll)
    BE-->>FE: status "ready"
    FE-->>S: Green "Ready" badge
```

If anything in the AI service fails, the document becomes `failed` with the reason (e.g. "No text could be found in this PDF…"), and the page offers **Retry**. If the backend restarts mid-way, documents still marked `processing` are processed again on startup.

## 6. Chat (RAG)

```mermaid
sequenceDiagram
    autonumber
    actor S as Student
    participant FE as Frontend<br/>Chat.jsx
    participant BE as Backend<br/>chatController
    participant DB as MongoDB
    participant AI as AI service<br/>rag.py
    participant G as Gemini

    S->>FE: "What are the conditions for deadlock?"
    FE->>BE: POST /api/chats/:id/messages {content}
    BE->>DB: At least one ready document in this subject?
    BE->>DB: Last 6 messages of this chat (for follow-ups)
    BE->>AI: POST /ask {subjectId, question, history}
    AI->>AI: Embed the question (+ previous question, for follow-ups like "give an example")
    AI->>AI: FAISS: top 5 closest chunks, each with a similarity score
    alt best score < 0.3 (not in the notes)
        AI-->>BE: "I couldn't find this in your notes" (no Gemini call)
    else relevant chunks found
        AI->>G: System rules + numbered sources [1]..[5] (file, page, text) + question
        G-->>AI: Answer with [n] markers, or NOT_IN_NOTES
        AI->>AI: Keep only [n] that point to real sources → citations {file, page, snippet}
        AI-->>BE: {answer, citations, grounded}
    end
    BE->>DB: Save the question + answer (only if the AI call succeeded)
    BE-->>FE: userMessage + assistantMessage
    FE-->>S: Answer with clickable [1] markers and "os.pdf · p. 3" chips
```

This is **Retrieval-Augmented Generation**. Gemini never sees the whole PDF, only the 5 most relevant passages, and it is told to answer only from them.

## 8. Quizzes

### Making a quiz

```mermaid
sequenceDiagram
    autonumber
    participant FE as Frontend<br/>Quiz.jsx
    participant BE as Backend<br/>quizController
    participant DB as MongoDB
    participant AI as AI service<br/>quiz.py
    participant G as Gemini

    FE->>BE: POST /api/subjects/:id/quizzes {topic?, count, difficulty}
    BE->>DB: Topic names from the subject's documents
    BE->>AI: POST /quiz {subjectId, topic, count, difficulty, knownTopics}
    alt topic given
        AI->>AI: FAISS top 10 chunks for the topic (≥ 0.3 or "not in notes")
    else whole subject
        AI->>AI: 12 chunks spread evenly through all notes
    end
    AI->>G: Rules + sources + "return JSON matching this schema"
    G-->>AI: {questions: [{question, options[4], answer, topic, explanation, source}]}
    AI->>AI: Drop questions with ≠ 4 options, repeats, bad answer index or source
    AI->>AI: Shuffle the options, track the right one
    AI-->>BE: questions with answerIndex + source page
    BE->>DB: Quiz WITH answers
    BE-->>FE: Quiz WITHOUT answers or explanations
```

### Taking and scoring it

```mermaid
sequenceDiagram
    autonumber
    actor S as Student
    participant FE as Frontend<br/>TakeQuiz.jsx · QuizResult.jsx
    participant BE as Backend<br/>quizController · services/scoring.js
    participant DB as MongoDB

    S->>FE: Answers one question at a time
    FE->>BE: POST /api/quizzes/:id/submit {answers: [1, 3, -1, ...]}
    BE->>DB: Load the quiz (with answers)
    BE->>BE: scoreQuiz(): count correct, % score,<br/>correct/total per topic (plain code, no AI)
    BE->>DB: QuizAttempt {answers, score, percent, topicBreakdown}
    BE-->>FE: Score + every question with the right answer,<br/>explanation and source page
    FE-->>S: Results page, weak topics, "Practise #lt;topic#gt;"
```

Gemini only **writes** the questions. Checking and scoring are plain code, so the results are reliable and explainable.

## 11. How every Gemini call is made

All Gemini calls go through one function, `generate()` in `ai-service/app/llm.py`. It handles the free tier's limits:

```mermaid
flowchart TD
    A[generate prompt] --> K{"GEMINI_API_KEY set?"}
    K -- no --> X1["503 'The Gemini API key is not set'"]
    K -- yes --> B["Call GEMINI_MODEL<br/>(gemini-3.5-flash)"]
    B --> C{Result}
    C -- answer --> OK([Return the text])
    C -- "503 / 504 / 500<br/>overloaded" --> W["Wait 2 s, then 5 s,<br/>retry (up to 3 tries)"]
    W --> B
    W -- "still failing" --> FB
    C -- "429 daily quota used" --> FB["Call GEMINI_FALLBACK_MODEL<br/>(gemini-3.5-flash-lite, own quota)"]
    FB --> D{Result}
    D -- answer --> OK
    D -- "429 again" --> X2["429 'Today's free Gemini limit has been used up.<br/>It resets in about N hours'"]
    D -- "still busy" --> X3["503 'Gemini is very busy right now…'"]
    C -- "404 model retired" --> X4["503 with Google's suggested model"]
```

Quizzes, flashcards, topics and plans use `generate_json()`, which asks Gemini for JSON matching a schema and asks once more if the reply doesn't fit.

## 13. Errors

| Where it fails | What the student sees | Where it's handled |
| --- | --- | --- |
| Wrong input (e.g. empty question) | Clear message next to the form (400) | `express-validator`, `middleware/validate.js` |
| Not logged in / expired / account gone | Back to login with a notice (401) | `middleware/auth.js`, Axios interceptor |
| Someone else's item, or a bad id | "… not found" (404) | Every controller filters by `userId` |
| Topic not in the notes | "I couldn't find … in your notes" (422) | AI service score check |
| Gemini busy / out of quota | "Gemini is very busy…" / "…resets in about N hours" | `ai-service/app/llm.py` |
| AI service down | "The AI service is not reachable. Is it running?" (502) | `backend/src/services/aiClient.js` |
| Backend down | "Can't reach StudyMate" + Try again, still logged in | `AuthContext`, `ProtectedRoute` |
| Bug on the server | Generic message; full details only in the server log | `errorHandler.js`, AI catch-all handler |
| A page crashes in the browser | "Something went wrong on this page" + Reload | `components/ErrorBoundary.jsx` |

Every API error has the same shape: `{ "error": { "code": "...", "message": "..." } }`.

## 14. When does the AI service come into the picture?

| Student action | Backend only | AI service | Gemini calls |
| --- | --- | --- | --- |
| Sign up, log in, subjects, dashboard, progress numbers | ✓ | | 0 |
| Upload a PDF | ✓ | `/ingest`: extract, chunk, embed, index | 1 (topics) |
| View extracted text | ✓ | `/documents/.../pages` | 0 |
| Ask a question in chat | ✓ | `/ask`: search FAISS | 1, or 0 if not in the notes |
| Summary | ✓ | `/summarize` | 1, or 0 if the topic is not in the notes |
| Generate a quiz | ✓ | `/quiz` | 1 |
| Submit a quiz, see results | ✓ (scoring in code) | | 0 |
| Generate flashcards | ✓ | `/flashcards` | 1 |
| Mark a flashcard | ✓ | | 0 |
| Study plan | ✓ (weak topics in code) | `/study-plan` | 1 |
| Delete a document or subject | ✓ | removes vectors and text | 0 |

The embeddings (MiniLM) and the vector search (FAISS) run on your own computer, so they're free and unlimited. Only the boxes marked with Gemini calls use the free daily quota.
